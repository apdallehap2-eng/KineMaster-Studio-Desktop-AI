
name: Build KineMaster Studio Windows 32-bit

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows 32-bit installer
        run: npm run dist:win32

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KineMaster-Studio-Windows-32bit-Installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7
